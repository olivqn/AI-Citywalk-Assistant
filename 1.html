<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <title>徐汇区 AI Citywalk 伴游助手</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="上海徐汇区AI伴游导览助手，智能步行路线规划与文化讲解">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            background: #0f1923;
            color: #e0e6ed;
            overflow: hidden;
        }

        /* ─── 整体布局 ─── */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ─── 顶部标题栏 ─── */
        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: linear-gradient(135deg, #0a1628 0%, #162a4a 100%);
            border-bottom: 1px solid rgba(24, 144, 255, 0.3);
            flex-shrink: 0;
        }

        #header h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        #header .subtitle {
            font-size: 12px;
            color: #5a7a9a;
        }

        /* ─── 地图区域 ─── */
        #map-section {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        #container {
            width: 100%;
            height: 100%;
        }

        /* ─── 左侧控制面板 ─── */
        #panel {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 999;
            background: rgba(15, 25, 40, 0.92);
            backdrop-filter: blur(12px);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(79, 172, 254, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            width: 260px;
        }

        #panel h3 {
            font-size: 15px;
            font-weight: 700;
            color: #4facfe;
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .input-group input {
            flex: 1;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(79, 172, 254, 0.3);
            border-radius: 6px;
            color: #e0e6ed;
            font-size: 13px;
            outline: none;
            transition: border-color .2s;
        }

        .input-group input:focus {
            border-color: #4facfe;
        }

        .input-group input::placeholder {
            color: #5a7a9a;
        }

        .btn {
            padding: 8px 14px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #0a1628;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: transform .15s, box-shadow .15s;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        .btn:active {
            transform: scale(0.97);
        }

        #route-list {
            list-style: none;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        #route-list li {
            padding: 5px 8px;
            font-size: 13px;
            color: #8ea4bd;
            border-left: 2px solid transparent;
            margin-bottom: 2px;
            border-radius: 0 4px 4px 0;
            transition: background .2s;
        }

        #route-list li.start-point {
            color: #4facfe;
            font-weight: 700;
            border-left-color: #4facfe;
            background: rgba(79, 172, 254, 0.08);
        }

        #route-list li:not(.start-point) {
            border-left-color: rgba(79, 172, 254, 0.15);
        }

        /* ─── 下方聊天面板 ─── */
        #chat-panel {
            height: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #0d1b2a 0%, #132236 100%);
            border-top: 1px solid rgba(79, 172, 254, 0.2);
        }

        #chat-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(79, 172, 254, 0.06);
            border-bottom: 1px solid rgba(79, 172, 254, 0.1);
            flex-shrink: 0;
        }

        #chat-header .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #0a1628;
            font-weight: 700;
        }

        #chat-header span {
            font-size: 13px;
            font-weight: 500;
            color: #8ea4bd;
        }

        #chat-header .online-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00e676;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        /* ─── 聊天消息区 ─── */
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        #chat-messages::-webkit-scrollbar-thumb {
            background: rgba(79, 172, 254, 0.3);
            border-radius: 2px;
        }

        .msg {
            display: flex;
            gap: 8px;
            max-width: 80%;
            animation: msgIn .3s ease-out;
        }

        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg .bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-word;
        }

        .msg.assistant .bubble {
            background: rgba(79, 172, 254, 0.12);
            border: 1px solid rgba(79, 172, 254, 0.2);
            color: #c8d6e5;
            border-top-left-radius: 4px;
        }

        .msg.user .bubble {
            background: linear-gradient(135deg, #4facfe, #00c6fb);
            color: #0a1628;
            border-top-right-radius: 4px;
            font-weight: 500;
        }

        .msg .msg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
        }

        .msg.assistant .msg-avatar {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #0a1628;
        }

        .msg.user .msg-avatar {
            background: rgba(79, 172, 254, 0.2);
            color: #4facfe;
        }

        /* 加载动画 */
        .typing-indicator .bubble {
            display: flex;
            gap: 4px;
            padding: 12px 18px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4facfe;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: .2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: .4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                opacity: .3;
                transform: scale(.8);
            }

            30% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ─── 输入栏 ─── */
        #chat-input-bar {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(10, 22, 40, 0.6);
            border-top: 1px solid rgba(79, 172, 254, 0.1);
            flex-shrink: 0;
        }

        #chat-input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(79, 172, 254, 0.25);
            border-radius: 20px;
            color: #e0e6ed;
            font-size: 13px;
            outline: none;
            transition: border-color .2s;
        }

        #chat-input:focus {
            border-color: #4facfe;
        }

        #chat-input::placeholder {
            color: #5a7a9a;
        }

        #send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .15s, box-shadow .15s;
            flex-shrink: 0;
        }

        #send-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.5);
        }

        #send-btn:active {
            transform: scale(0.95);
        }

        #send-btn svg {
            width: 18px;
            height: 18px;
            fill: #0a1628;
        }

        /* ─── 滚动条 ─── */
        #route-list::-webkit-scrollbar {
            width: 3px;
        }

        #route-list::-webkit-scrollbar-thumb {
            background: rgba(79, 172, 254, 0.3);
            border-radius: 2px;
        }
    </style>
    <script type="text/javascript"
        src="https://api.map.baidu.com/api?v=1.0&type=webgl&ak=XS8HdzSDKpKJG7uGCsyuoJ6xCcxSrMwv"></script>
</head>

<body>
    <div id="app">
        <!-- 顶部标题栏 -->
        <div id="header">
            <div>
                <h1>🚶 AI Citywalk · 徐汇伴游</h1>
                <div class="subtitle">上海徐汇海派文化智能导览</div>
            </div>
        </div>

        <!-- 地图区域 -->
        <div id="map-section">
            <div id="container"></div>
            <div id="panel">
                <h3>📍 路线规划</h3>
                <div class="input-group">
                    <input type="text" id="gps-input" value="上海图书馆" placeholder="输入当前位置">
                    <button class="btn" onclick="simulateGPS()">定位</button>
                </div>
                <ul id="route-list">
                    <li>等待定位...</li>
                </ul>
            </div>
        </div>

        <!-- 聊天面板 -->
        <div id="chat-panel">
            <div id="chat-header">
                <div class="avatar">徐</div>
                <span>AI导游 · 小徐</span>
                <div class="online-dot"></div>
            </div>
            <div id="chat-messages">
                <div class="msg assistant">
                    <div class="msg-avatar">徐</div>
                    <div class="bubble">你好呀！我是你的AI伴游导游"小徐"🎒 今天带你漫步徐汇区，感受海派文化的魅力！有什么想了解的，随时问我~</div>
                </div>
            </div>
            <div id="chat-input-bar">
                <input type="text" id="chat-input" placeholder="问问小徐：这附近有什么好吃的？" autocomplete="off">
                <button id="send-btn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentUserPoint = null; // 在 simulateGPS 中保存，供 AI 路线规划使用

        // ─── 百度地图初始化 ───
        const map = new BMapGL.Map("container");
        map.centerAndZoom(new BMapGL.Point(121.445, 31.205), 15);
        map.enableScrollWheelZoom(true);
        // 暗色地图风格
        map.setMapStyleV2({ styleId: '6b0a5e0b2bef73dabbbb2b6b5c2b0341' });

        const baseRoute = [
            { name: "武康大楼", lng: 121.446487, lat: 31.209386 },
            { name: "百代小红楼", lng: 121.445171, lat: 31.203008 },
            { name: "徐家汇天主堂", lng: 121.442967, lat: 31.198305 }
        ];

        // ─── 模拟定位 ───
        function simulateGPS() {
            const address = document.getElementById("gps-input").value;
            if (!address) return alert("请输入位置");

            document.getElementById('route-list').innerHTML = "<li>路线规划中...</li>";

            const myGeo = new BMapGL.Geocoder();
            myGeo.getPoint(address, function (point) {
                if (point) {
                    currentUserPoint = point; // 保存当前定位结果
                    map.clearOverlays();

                    // 蓝色大箭头标识用户位置
                    const arrowHTML = `<div style="font-size: 44px; color: #4facfe; filter: drop-shadow(0 2px 6px rgba(79,172,254,0.6)); transform: rotate(-90deg); line-height:1;">➤</div>`;
                    const userArrow = new BMapGL.Label(arrowHTML, {
                        position: point,
                        offset: new BMapGL.Size(-22, -22)
                    });
                    userArrow.setStyle({ background: 'transparent', border: 'none' });
                    map.addOverlay(userArrow);

                    // 组装路线
                    const fullRoute = [
                        { name: "我的位置", lng: point.lng, lat: point.lat, isStart: true },
                        ...baseRoute
                    ];

                    // 更新面板
                    document.getElementById('route-list').innerHTML = fullRoute.map((spot, index) => {
                        if (spot.isStart) return `<li class="start-point">📍 您的位置：${address}</li>`;
                        return `<li>${index}. ${spot.name}</li>`;
                    }).join('');

                    drawCitywalkRoute(fullRoute);
                } else {
                    alert("无法解析该地址，请尝试输入具体地标");
                    document.getElementById('route-list').innerHTML = "<li>定位失败</li>";
                }
            }, "上海市");
        }

        // ─── 步行路线绘制 ───
        async function drawCitywalkRoute(routeArr) {
            const walk = new BMapGL.WalkingRoute(map);
            let fullPath = [];

            for (let i = 0; i < routeArr.length - 1; i++) {
                let pStart = new BMapGL.Point(routeArr[i].lng, routeArr[i].lat);
                let pEnd = new BMapGL.Point(routeArr[i + 1].lng, routeArr[i + 1].lat);

                await new Promise((resolve) => {
                    walk.setSearchCompleteCallback(function (result) {
                        if (walk.getStatus() === BMAP_STATUS_SUCCESS) {
                            let plan = result.getPlan(0);
                            fullPath = fullPath.concat(plan.getRoute(0).getPath());
                        }
                        resolve();
                    });
                    walk.search(pStart, pEnd);
                });
            }

            // 绘制渐变路线
            const polyline = new BMapGL.Polyline(fullPath, {
                strokeColor: "#4facfe",
                strokeWeight: 5,
                strokeOpacity: 0.85
            });
            map.addOverlay(polyline);

            // 添加景点标记
            routeArr.forEach((spot, index) => {
                if (spot.isStart) return;
                let pt = new BMapGL.Point(spot.lng, spot.lat);
                let marker = new BMapGL.Marker(pt);
                let label = new BMapGL.Label(`${index}. ${spot.name}`, { offset: new BMapGL.Size(15, -25) });
                label.setStyle({
                    color: '#fff',
                    backgroundColor: '#e74c3c',
                    border: 'none',
                    borderRadius: '6px',
                    padding: '5px 10px',
                    fontSize: '12px',
                    fontWeight: '500',
                    boxShadow: '0 2px 8px rgba(231,76,60,0.4)'
                });
                marker.setLabel(label);
                map.addOverlay(marker);
            });

            map.setViewport(fullPath, { margins: [50, 50, 50, 50] });
        }

        // ─── AI 聊天逻辑 ───
        const API_URL = "https://ai-citywalk-assistant.onrender.com";
        let chatHistory = []; // 记忆历史

        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');

        // 回车发送
        chatInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function appendMessage(role, content) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            const avatarText = role === 'assistant' ? '徐' : '我';
            div.innerHTML = `
                <div class="msg-avatar">${avatarText}</div>
                <div class="bubble">${content}</div>
            `;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'msg assistant typing-indicator';
            div.id = 'typing-indicator';
            div.innerHTML = `
                <div class="msg-avatar">徐</div>
                <div class="bubble">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            chatInput.value = '';
            appendMessage('user', text);
            showTyping();

            try {
                const resp = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        history: chatHistory
                    })
                });
                const data = await resp.json();
                removeTyping();

                if (data.action === "plan_route") {
                    appendMessage('assistant', `好的，正在为您在附近搜索包含“${data.keywords.join('、')}”的地点，并规划最佳路线...`);
                    // 不直接把搜索动画加进大模型历史上下文，交给 searchAndPlanRoute 去补充
                    searchAndPlanRoute(data.keywords);
                } else {
                    // 更新历史
                    chatHistory.push({ role: 'user', content: text });
                    chatHistory.push({ role: 'assistant', content: data.reply });
                    appendMessage('assistant', data.reply);
                }
            } catch (err) {
                removeTyping();
                appendMessage('assistant', '网络连接失败，请确保后端服务已启动 (uvicorn main:app --reload)');
            }
        }

        // ─── 工具函数：Haversine 公式计算两点间距离（米） ───
        function haversineDistance(p1, p2) {
            const R = 6371000;
            const toRad = x => x * Math.PI / 180;
            const dLat = toRad(p2.lat - p1.lat);
            const dLng = toRad(p2.lng - p1.lng);
            const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(p1.lat)) * Math.cos(toRad(p2.lat)) *
                Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // ─── AI 调用的百度地图周边搜索与智能路径规划 ───
        async function searchAndPlanRoute(keywords) {
            if (!currentUserPoint) {
                appendMessage('assistant', '抱歉，需要您的当前位置完成定位，我才能帮您规划路线哦。');
                return;
            }

            console.log('[searchAndPlanRoute] 开始搜索, keywords:', keywords);

            // 逐个关键词搜索，合并所有 POI
            let allPois = [];

            for (const keyword of keywords) {
                console.log('[searchAndPlanRoute] 搜索关键词:', keyword);
                const pois = await new Promise((resolve) => {
                    const local = new BMapGL.LocalSearch(map, {
                        pageCapacity: 10,
                        onSearchComplete: function (result) {
                            let found = [];
                            if (local.getStatus() === BMAP_STATUS_SUCCESS && result) {
                                const num = result.getCurrentNumPois();
                                console.log('[searchAndPlanRoute] 关键词"' + keyword + '"找到', num, '个结果');
                                for (let i = 0; i < num; i++) {
                                    const poi = result.getPoi(i);
                                    if (poi && poi.point) {
                                        found.push(poi);
                                    }
                                }
                            } else {
                                console.log('[searchAndPlanRoute] 关键词"' + keyword + '"搜索失败, status:', local.getStatus());
                            }
                            resolve(found);
                        }
                    });
                    local.searchNearby(keyword, currentUserPoint, 4000);
                });
                allPois = allPois.concat(pois);
            }

            console.log('[searchAndPlanRoute] 总共找到 POI 数量:', allPois.length);

            // 去重（按名称）
            const seen = new Set();
            allPois = allPois.filter(poi => {
                if (seen.has(poi.title)) return false;
                seen.add(poi.title);
                return true;
            });

            if (allPois.length === 0) {
                appendMessage('assistant', '抱歉呀，我没有在这附近找到相关的地点，您可以换个说法或别的关键词试试嘛？');
                return;
            }

            // ─── AI 二次过滤：用小模型筛掉不符合用户意图的地点 ───
            console.log('[searchAndPlanRoute] 开始 AI 过滤, POI 数量:', allPois.length);
            try {
                const poiNames = allPois.map(p => p.title);
                const recentHistory = chatHistory.slice(-10);
                const filterResp = await fetch('http://localhost:8000/api/filter_pois', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        poi_names: poiNames,
                        user_message: keywords.join(' '),
                        history: recentHistory
                    })
                });
                const filterData = await filterResp.json();
                if (filterData.filtered_names && filterData.filtered_names.length > 0) {
                    const keepSet = new Set(filterData.filtered_names);
                    allPois = allPois.filter(p => keepSet.has(p.title));
                    console.log('[searchAndPlanRoute] AI 过滤后保留 POI 数量:', allPois.length, '→', filterData.filtered_names);
                }
            } catch (filterErr) {
                console.warn('[searchAndPlanRoute] AI 过滤失败，使用原始列表:', filterErr);
            }

            if (allPois.length === 0) {
                appendMessage('assistant', '抱歉呀，AI 筛选后没有发现特别适合的地点，您可以换个说法试试嘛？');
                return;
            }

            // 贪心算法规划路线 (最大 4000 米)
            let currentPt = { lat: currentUserPoint.lat, lng: currentUserPoint.lng };
            const maxDist = 4000;
            let currentDist = 0;
            let plannedRoute = [{ name: "我的位置", lng: currentPt.lng, lat: currentPt.lat, isStart: true }];
            let remainingPois = [...allPois];

            while (remainingPois.length > 0) {
                let nearestIdx = -1;
                let minDist = Infinity;

                for (let i = 0; i < remainingPois.length; i++) {
                    const d = haversineDistance(currentPt, remainingPois[i].point);
                    if (d < minDist) {
                        minDist = d;
                        nearestIdx = i;
                    }
                }

                if (nearestIdx === -1) break;
                if (currentDist + minDist > maxDist) break;

                const nextPoi = remainingPois[nearestIdx];
                currentDist += minDist;
                plannedRoute.push({
                    name: nextPoi.title,
                    lng: nextPoi.point.lng,
                    lat: nextPoi.point.lat
                });
                currentPt = { lat: nextPoi.point.lat, lng: nextPoi.point.lng };
                remainingPois.splice(nearestIdx, 1);

                if (plannedRoute.length >= 6) break; // 最多途经 5 个景点
            }

            console.log('[searchAndPlanRoute] 规划路线包含', plannedRoute.length, '个点, 总距离:', currentDist.toFixed(0), '米');

            if (plannedRoute.length <= 1) {
                appendMessage('assistant', '抱歉呀，虽然找到了相关地点，但它们离这里太远了（超过4km），请换个近一点的搜寻意向吧~');
                return;
            }

            // 更新面板
            document.getElementById('route-list').innerHTML = plannedRoute.map((spot, index) => {
                if (spot.isStart) return `<li class="start-point">📍 您的位置</li>`;
                return `<li>${index}. ${spot.name}</li>`;
            }).join('');

            // 清除旧覆盖物并重绘蓝箭头
            map.clearOverlays();
            const arrowHTML = `<div style="font-size: 44px; color: #4facfe; filter: drop-shadow(0 2px 6px rgba(79,172,254,0.6)); transform: rotate(-90deg); line-height:1;">➤</div>`;
            const userArrow = new BMapGL.Label(arrowHTML, {
                position: currentUserPoint,
                offset: new BMapGL.Size(-22, -22)
            });
            userArrow.setStyle({ background: 'transparent', border: 'none' });
            map.addOverlay(userArrow);

            // 画步行路线
            drawCitywalkRoute(plannedRoute);

            // 聊天框播报
            let reportText = `已为您成功规划！总行程约 ${(currentDist / 1000).toFixed(1)} km。途经地点有：<br>`;
            for (let i = 1; i < plannedRoute.length; i++) {
                reportText += `${i}. ${plannedRoute[i].name}<br>`;
            }

            // 追加进大模型历史
            const userKeywords = keywords.join("、");
            chatHistory.push({ role: 'user', content: `我们要去包含${userKeywords}的地方` });
            chatHistory.push({ role: 'assistant', content: reportText.replace(/<br>/g, "\n") });

            appendMessage('assistant', reportText);
        }

        // ─── 页面加载时自动定位 ───
        window.onload = simulateGPS;
    </script>
</body>

</html>
