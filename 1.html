<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <title>徐汇区 AI Citywalk 伴游助手</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="上海徐汇区AI伴游导览助手，智能步行路线规划与文化讲解">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            background: #0f1923;
            color: #e0e6ed;
            overflow: hidden;
        }

        /* ─── 整体布局 ─── */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ─── 顶部标题栏 ─── */
        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: linear-gradient(135deg, #0a1628 0%, #162a4a 100%);
            border-bottom: 1px solid rgba(24, 144, 255, 0.3);
            flex-shrink: 0;
        }

        #header h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        #header .subtitle {
            font-size: 12px;
            color: #5a7a9a;
        }

        /* ─── 地图区域 ─── */
        #map-section {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        #container {
            width: 100%;
            height: 100%;
        }

        /* ─── 左侧控制面板 ─── */
        #panel {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 999;
            background: rgba(15, 25, 40, 0.92);
            backdrop-filter: blur(12px);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(79, 172, 254, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            width: 260px;
            overflow: visible;
        }

        #panel h3 {
            font-size: 15px;
            font-weight: 700;
            color: #4facfe;
            margin-bottom: 12px;
        }

        .location-search {
            position: relative;
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .input-group input {
            flex: 1;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(79, 172, 254, 0.3);
            border-radius: 6px;
            color: #e0e6ed;
            font-size: 13px;
            outline: none;
            transition: border-color .2s;
        }

        .input-group input:focus {
            border-color: #4facfe;
        }

        .input-group input::placeholder {
            color: #5a7a9a;
        }

        #gps-suggestions {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            z-index: 1001;
            display: none;
            max-height: 230px;
            overflow-y: auto;
            background: rgba(9, 20, 34, 0.98);
            border: 1px solid rgba(79, 172, 254, 0.35);
            border-radius: 8px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.38);
        }

        .gps-suggestion {
            width: 100%;
            padding: 9px 10px;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(79, 172, 254, 0.1);
            color: #c8d6e5;
            text-align: left;
            cursor: pointer;
        }

        .gps-suggestion:last-child {
            border-bottom: none;
        }

        .gps-suggestion:hover,
        .gps-suggestion:focus {
            background: rgba(79, 172, 254, 0.12);
            outline: none;
        }

        .gps-suggestion .poi-name {
            display: block;
            color: #e0e6ed;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.35;
        }

        .gps-suggestion .poi-address {
            display: block;
            margin-top: 3px;
            color: #7891ac;
            font-size: 12px;
            line-height: 1.4;
        }

        .gps-suggestion-empty {
            padding: 10px;
            color: #7891ac;
            font-size: 12px;
            line-height: 1.5;
        }

        .btn {
            padding: 8px 14px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #0a1628;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: transform .15s, box-shadow .15s;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        .btn:active {
            transform: scale(0.97);
        }

        #route-list {
            list-style: none;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        #route-list li {
            padding: 5px 8px;
            font-size: 13px;
            color: #8ea4bd;
            border-left: 2px solid transparent;
            margin-bottom: 2px;
            border-radius: 0 4px 4px 0;
            transition: background .2s;
        }

        #route-list li.start-point {
            color: #4facfe;
            font-weight: 700;
            border-left-color: #4facfe;
            background: rgba(79, 172, 254, 0.08);
        }

        #route-list li:not(.start-point) {
            border-left-color: rgba(79, 172, 254, 0.15);
        }

        #ai-context {
            display: none;
            margin: 12px 0;
            padding: 10px;
            background: rgba(79, 172, 254, 0.08);
            border-radius: 8px;
        }

        #ai-context.visible {
            display: block;
        }

        .context-title,
        .route-summary-title {
            color: #c8d6e5;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        #context-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .context-chip {
            padding: 3px 7px;
            border-radius: 999px;
            color: #bfe8ff;
            background: rgba(79, 172, 254, 0.14);
            font-size: 11px;
        }

        #ai-interpretation {
            margin-top: 7px;
            color: #7891ac;
            font-size: 11px;
            line-height: 1.5;
        }

        #route-summary {
            display: none;
            margin-bottom: 8px;
            color: #8ea4bd;
            font-size: 12px;
            line-height: 1.5;
        }

        #route-summary.visible {
            display: block;
        }

        #route-list li.route-stop {
            cursor: pointer;
            padding-top: 7px;
            padding-bottom: 7px;
        }

        .route-stop-name {
            display: block;
            color: #c8d6e5;
            font-weight: 700;
        }

        .route-stop-reason {
            display: block;
            margin-top: 2px;
            color: #657f9b;
            font-size: 11px;
            line-height: 1.4;
        }

        /* ─── 下方聊天面板 ─── */
        #chat-panel {
            height: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #0d1b2a 0%, #132236 100%);
            border-top: 1px solid rgba(79, 172, 254, 0.2);
        }

        #chat-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(79, 172, 254, 0.06);
            border-bottom: 1px solid rgba(79, 172, 254, 0.1);
            flex-shrink: 0;
        }

        #chat-header .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #0a1628;
            font-weight: 700;
        }

        #chat-header span {
            font-size: 13px;
            font-weight: 500;
            color: #8ea4bd;
        }

        #chat-header .online-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00e676;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        /* ─── 聊天消息区 ─── */
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        #chat-messages::-webkit-scrollbar-thumb {
            background: rgba(79, 172, 254, 0.3);
            border-radius: 2px;
        }

        .msg {
            display: flex;
            gap: 8px;
            max-width: 80%;
            animation: msgIn .3s ease-out;
        }

        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg .bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-word;
        }

        .msg.assistant .bubble {
            background: rgba(79, 172, 254, 0.12);
            border: 1px solid rgba(79, 172, 254, 0.2);
            color: #c8d6e5;
            border-top-left-radius: 4px;
        }

        .msg.user .bubble {
            background: linear-gradient(135deg, #4facfe, #00c6fb);
            color: #0a1628;
            border-top-right-radius: 4px;
            font-weight: 500;
        }

        .msg .msg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
        }

        .msg.assistant .msg-avatar {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #0a1628;
        }

        .msg.user .msg-avatar {
            background: rgba(79, 172, 254, 0.2);
            color: #4facfe;
        }

        /* 加载动画 */
        .typing-indicator .bubble {
            display: flex;
            gap: 4px;
            padding: 12px 18px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4facfe;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: .2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: .4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                opacity: .3;
                transform: scale(.8);
            }

            30% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ─── 输入栏 ─── */
        #chat-input-bar {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(10, 22, 40, 0.6);
            border-top: 1px solid rgba(79, 172, 254, 0.1);
            flex-shrink: 0;
        }

        #chat-input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(79, 172, 254, 0.25);
            border-radius: 20px;
            color: #e0e6ed;
            font-size: 13px;
            outline: none;
            transition: border-color .2s;
        }

        #chat-input:focus {
            border-color: #4facfe;
        }

        #chat-input::placeholder {
            color: #5a7a9a;
        }

        #send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .15s, box-shadow .15s;
            flex-shrink: 0;
        }

        #send-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.5);
        }

        #send-btn:active {
            transform: scale(0.95);
        }

        #send-btn svg {
            width: 18px;
            height: 18px;
            fill: #0a1628;
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .quick-prompts {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-left: 36px;
        }

        .quick-prompt {
            padding: 6px 10px;
            border: 1px solid rgba(79, 172, 254, 0.25);
            border-radius: 999px;
            color: #8fcdf5;
            background: rgba(79, 172, 254, 0.06);
            cursor: pointer;
            font-size: 12px;
        }

        .quick-prompt:hover {
            background: rgba(79, 172, 254, 0.14);
        }

        .ai-progress {
            display: grid;
            gap: 5px;
        }

        .ai-progress-step {
            color: #69819a;
        }

        .ai-progress-step.active {
            color: #bfe8ff;
        }

        .ai-progress-step.done {
            color: #55d6a0;
        }

        .theme-note {
            margin-top: 7px;
            padding-top: 7px;
            border-top: 1px solid rgba(79, 172, 254, 0.16);
            color: #8fcdf5;
            font-size: 12px;
        }

        @media (max-width: 640px) {
            #header {
                padding: 8px 12px;
            }

            #header .subtitle {
                display: none;
            }

            #map-section {
                min-height: 43vh;
            }

            #panel {
                top: 8px;
                left: 8px;
                right: 8px;
                width: auto;
                padding: 12px;
                max-height: 210px;
                overflow-y: auto;
                overflow-anchor: none;
            }

            #panel h3 {
                display: none;
            }

            #route-list {
                max-height: 76px;
            }

            .route-stop-reason {
                display: none;
            }

            #chat-panel {
                height: 48vh;
                min-height: 300px;
            }

            .msg {
                max-width: 94%;
            }

            .quick-prompts {
                margin-left: 0;
            }
        }

        /* ─── 滚动条 ─── */
        #route-list::-webkit-scrollbar {
            width: 3px;
        }

        #route-list::-webkit-scrollbar-thumb {
            background: rgba(79, 172, 254, 0.3);
            border-radius: 2px;
        }
    </style>
    <script type="text/javascript"
        src="https://api.map.baidu.com/api?v=1.0&type=webgl&ak=XS8HdzSDKpKJG7uGCsyuoJ6xCcxSrMwv"></script>
</head>

<body>
    <div id="app">
        <!-- 顶部标题栏 -->
        <div id="header">
            <div>
                <h1>🚶 AI Citywalk · 徐汇伴游</h1>
                <div class="subtitle">上海徐汇海派文化智能导览</div>
            </div>
        </div>

        <!-- 地图区域 -->
        <div id="map-section">
            <div id="container"></div>
            <div id="panel">
                <h3>📍 路线规划</h3>
                <div class="location-search">
                    <div class="input-group">
                        <input type="text" id="gps-input" placeholder="输入起点，如上海图书馆" autocomplete="off">
                        <button class="btn" id="set-start-btn">设为起点</button>
                    </div>
                    <div id="gps-suggestions"></div>
                </div>
                <div id="ai-context" aria-live="polite">
                    <div class="context-title">AI 对你的理解</div>
                    <div id="context-chips"></div>
                    <div id="ai-interpretation"></div>
                </div>
                <div id="route-summary"></div>
                <ul id="route-list">
                    <li>告诉小徐你想从哪里出发、想怎么逛</li>
                </ul>
            </div>
        </div>

        <!-- 聊天面板 -->
        <div id="chat-panel">
            <div id="chat-header">
                <div class="avatar">徐</div>
                <span>AI导游 · 小徐</span>
                <div class="online-dot"></div>
            </div>
            <div id="chat-messages">
                <div class="msg assistant">
                    <div class="msg-avatar">徐</div>
                    <div class="bubble">你好，我是小徐。告诉我从哪里出发、想逛多久、喜欢什么，我会一边理解，一边替你操作地图。</div>
                </div>
                <div class="quick-prompts" aria-label="示例需求">
                    <button class="quick-prompt" type="button">从上海图书馆出发，两小时看老洋房，最后喝咖啡</button>
                    <button class="quick-prompt" type="button">从徐家汇出发，走一条有科幻感的路线</button>
                    <button class="quick-prompt" type="button">从衡山路出发，轻松逛花园和书店</button>
                </div>
            </div>
            <div id="chat-input-bar">
                <input type="text" id="chat-input" placeholder="问问小徐：这附近有什么好吃的？" autocomplete="off">
                <button id="send-btn" aria-label="发送">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>

</html>
